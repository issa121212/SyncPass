spring:
  application:
    name: cursos
  # Permite activar el perfil desde .env (se carga como system property).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mi_base_datos}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8080}

aws:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:us-east-1_xxxxxxxxx}
    client-id: ${AWS_COGNITO_CLIENT_ID:xxxxxxxxxxxxxxxxxxxxxxxxxx}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}

# Configuración CORS
# Habilitar/deshabilitar CORS completamente (útil para deshabilitar cuando pasa por API Gateway)
app:
  cors:
    enabled: ${CORS_ENABLED:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization,Content-Type}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}
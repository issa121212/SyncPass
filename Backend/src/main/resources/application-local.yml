# ============================================================
# Perfil `local` — MVP sin PostgreSQL ni Docker.
#
# Uso:
#   SPRING_PROFILES_ACTIVE=local   (definido en .env)
#   ./gradlew bootRun
#
# Base de datos en memoria (H2), esquema creado por Hibernate y
# Flyway deshabilitado. Los datos se pierden al detener la app.
# Para persistencia real usar PostgreSQL + Flyway (perfil por defecto).
# ============================================================
spring:
  datasource:
    # Valores fijos a propósito: el perfil local nunca debe intentar
    # conectarse a PostgreSQL aunque DATABASE_URL esté definido en .env.
    url: jdbc:h2:mem:syncpass;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
      path: /h2-console

logging:
  level:
    root: INFO
    com.duoc.cursos: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    password-login-enabled: true
